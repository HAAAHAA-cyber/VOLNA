<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MyMessenger</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/themes.css">
</head>
<body>
    <!-- Экран авторизации -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-container">
            <!-- Форма входа -->
            <div class="auth-form" id="loginForm">
                <h2>Вход в мессенджер</h2>
                <input type="text" id="loginUsername" placeholder="Имя пользователя" required>
                <input type="password" id="loginPassword" placeholder="Пароль" required>
                <button id="loginBtn">Войти</button>
                <p>Нет аккаунта? <a href="#" id="showRegister">Зарегистрироваться</a></p>
            </div>

            <!-- Форма регистрации -->
            <div class="auth-form" id="registerForm" style="display: none;">
                <h2>Регистрация</h2>
                <input type="text" id="regUsername" placeholder="Имя пользователя" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPassword" placeholder="Пароль" required>
                <input type="password" id="confirmPassword" placeholder="Подтвердите пароль" required>
                <button id="registerBtn">Зарегистрироваться</button>
                <p>Уже есть аккаунт? <a href="#" id="showLogin">Войти</a></p>
            </div>
        </div>
    </div>

    <!-- Основное приложение -->
    <div id="appContainer" style="display: none;">
        <div class="app-container">
            <!-- Левая панель -->
            <aside class="sidebar">
                <div class="user-profile">
                    <div class="avatar" id="userAvatar"></div>
                    <span id="currentUser"></span>
                    <button class="theme-toggle" id="themeToggle">Тёмная тема</button>
                    <button onclick="logout()" class="logout-btn">Выйти</button>
                </div>

                <nav class="tabs">
                    <button class="tab active" data-tab="chats">Чаты</button>
                    <button class="tab" data-tab="groups">Группы</button>
                    <button class="tab" data-tab="channels">Каналы</button>
                    <button class="tab" data-tab="posts">Посты</button>
                </nav>

                <div class="contacts-list" id="contactsList"></div>
            </aside>

            <!-- Правая панель — чат -->
            <main class="chat-panel">
                <header class="chat-header">
                    <div class="current-contact">
                        <div class="chat-avatar" id="chatAvatar"></div>
                        <div class="contact-details">
                            <div id="chatName"></div>
                            <div id="chatStatus" class="online-status"></div>
                </div>
                <div class="chat-actions">
                    <button class="action-btn">📞</button>
            <button class="action-btn">📹</button>
        </div>
    </header>

    <div class="messages-container" id="messages"></div>

    <footer class="message-input">
        <button class="input-btn">📷</button>
        <input type="text" id="messageInput" placeholder="Введите сообщение...">
        <button id="sendButton">Отправить</button>
    </footer>
</main>
</div>
</div>
    <!-- В форме создания поста -->
<div class="post-create">
    <textarea id="postContent" placeholder="Что у вас нового?"></textarea>
    <input type="file" id="fileInput" multiple accept="image/*,.txt,.pdf,.doc,.docx">
    <ul id="selectedFiles"></ul>
    <button id="createPostBtn">Создать пост</button>
</div>

<!-- Контейнер для постов -->
<div id="postsContainer"></div>
    <div class="user-profile">
    <div class="avatar-upload">
        <label for="avatarInput" class="avatar-label">
            <img id="currentAvatar"
                 src="assets/avatars/default.png"
                 alt="Аватар пользователя"
                 class="user-avatar">
            <span>Изменить аватар</span>
        </label>
        <input type="file"
               id="avatarInput"
               accept="image/*"
               style="display: none;">
    </div>
    <!-- Остальные элементы профиля -->
</div>


<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/chat.js"></script>
<script src="js/posts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
