<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Волна — Подключись и лови волну</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            /* Фиолетово-синий перелив */
            background: linear-gradient(135deg, #6A0DAD, #0000FF, #000000);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            display: flex;
            color: white;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        .main-chat {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 30px; }
        .message-area {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin-bottom: 20px;
            padding: 20px;
        }
        .input-box {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 15px;
            border-radius: 10px;
            color: white;
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">🌊 ВОЛНА</div>
        <p>Моя страница</p>
        <p>Сообщения</p>
        <p>Друзья</p>
    </div>
    <div class="main-chat">
        <div class="message-area">
            <h3>Чат: Лови волну</h3>
            <p><i>Здесь скоро будут твои сообщения...</i></p>
        </div>
        <input type="text" class="input-box" placeholder="Напиши что-нибудь...">
    </div>
</body>
</html>
