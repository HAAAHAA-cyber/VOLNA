<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Веб‑мессенджер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="messenger-container">
        <!-- Левая панель — список контактов -->
        <div class="contacts-panel">
            <div class="search-bar">
                <input type="text" placeholder="Поиск контактов...">
            </div>
            <div class="contacts-list">
                <div class="contact active" data-chat="1">
                    <div class="avatar">А</div>
                    <div class="contact-info">
                        <div class="contact-name">Анна Иванова</div>
                        <div class="last-message">Привет, как дела?</div>
                    </div>
                    <div class="message-time">14:30</div>
                </div>
                <div class="contact" data-chat="2">
                    <div class="avatar">П</div>
                    <div class="contact-info">
                        <div class="contact-name">Пётр Сидоров</div>
                        <div class="last-message">Отправь фото</div>
                    </div>
                    <div class="message-time">13:45</div>
                </div>
            </div>
        </div>

        <!-- Правая панель — чат -->
        <div class="chat-panel">
            <div class="chat-header">
                <div class="current-contact">
                    <div class="avatar">А</div>
                    <div class="contact-details">
                        <div class="contact-name">Анна Иванова</div>
                        <div class="online-status">онлайн</div>
                    </div>
                </div>
            </div>
            <div class="messages-container" id="messages">
                <!-- Сообщения будут добавляться здесь -->
            </div>
            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Напишите сообщение...">
                <button id="sendButton">Отправить</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
