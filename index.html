<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ВОЛНА - ПОДКЛЮЧИСЬ И ЛОВИ</title>
    <style>
        /* Глобальные настройки в стиле ИТД: жирно, ярко, вырвиглазно */
        * { box-sizing: border-box; cursor: crosshair; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: "Arial Black", sans-serif;
            /* Фиолетово-синий перелив на фоне */
            background: linear-gradient(-45deg, #4b0082, #0000ff, #1a1a1a);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            color: #fff;
            min-height: 100vh;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.85); /* Черная подложка как на ИТД */
            min-height: 100vh;
            border-left: 5px solid #fff;
            border-right: 5px solid #fff;
            padding: 20px;
        }

        .header {
            font-size: 80px; /* Гигантский текст */
            line-height: 0.8;
            letter-spacing: -5px;
            margin-bottom: 10px;
            text-shadow: 5px 5px #ff00ff;
        }

        .slogan {
            background: #fff;
            color: #000;
            display: inline-block;
            padding: 5px 15px;
            font-size: 20px;
            transform: rotate(-1deg);
            margin-bottom: 40px;
        }

        .input-wave {
            width: 100%;
            background: none;
            border: 5px solid #fff;
            padding: 20px;
            color: #fff;
            font-size: 30px;
            font-family: "Arial Black";
            outline: none;
            margin-bottom: 30px;
        }

        .input-wave:focus {
            background: #fff;
            color: #000;
        }

        .feed-item {
            border-bottom: 2px dashed #555;
            padding: 15px 0;
            font-size: 22px;
        }

        .nick {
            color: #00ffff;
            text-transform: uppercase;
            text-decoration: underline;
        }

        .msg { color: #ff00ff; }

        /* Кнопки тем */
        .theme-switcher {
            position: fixed;
            right: 10px;
            top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .t-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="theme-switcher">
        <button class="t-btn" onclick="document.body.style.background='#000'">ЧЕРНЫЙ</button>
        <button class="t-btn" onclick="document.body.style.background='#fff'; document.body.style.color='#000'">БЕЛЫЙ</button>
        <button class="t-btn" onclick="location.reload()">ВОЛНА</button>
    </div>

    <div class="wrapper">
        <div class="header">ВОЛНА</div>
        <div class="slogan">ПОДКЛЮЧИСЬ И ЛОВИ ВОЛНУ</div>

        <input type="text" class="input-wave" placeholder="ЧТО СКАЖЕШЬ?">

        <div id="feed">
            <div class="feed-item">
                [<span class="nick">ADMIN</span>] <span class="msg">ДОБРО ПОЖАЛОВАТЬ В ПОТОК.</span>
            </div>
            <div class="feed-item">
                [<span class="nick">СИСТЕМА</span>] <span class="msg">ТУТ НЕТ ПРАВИЛ. ЛОВИ КУРАЖ.</span>
            </div>
        </div>
    </div>

</body>
</html>
