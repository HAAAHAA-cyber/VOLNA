<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВОЛНА</title>
    <style>
        /* Переключение тем через переменные */
        :root {
            --bg: linear-gradient(45deg, #4b0082, #0000ff);
            --text: #ffffff;
            --border: #ffffff;
        }
        [data-theme="black"] {
            --bg: #000000;
            --text: #00ff00; /* Матрица-стайл */
            --border: #00ff00;
        }
        [data-theme="white"] {
            --bg: #ffffff;
            --text: #000000;
            --border: #000000;
        }

        body {
            background: var(--bg);
            background-attachment: fixed;
            color: var(--text);
            font-family: "Arial Black", Gadget, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            font-size: 50px;
            text-transform: uppercase;
            border-bottom: 5px solid var(--border);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        .themes {
            font-size: 14px;
            cursor: pointer;
        }

        .themes span {
            margin-left: 10px;
            border: 1px solid var(--border);
            padding: 5px;
        }

        .post {
            border-left: 10px solid var(--border);
            padding: 10px 20px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
        }

        .nick {
            color: #ff00ff;
            text-decoration: underline;
            cursor: pointer;
        }

        input {
            width: 100%;
            background: none;
            border: none;
            border-bottom: 3px solid var(--border);
            color: var(--text);
            font-size: 24px;
            outline: none;
            padding: 10px 0;
        }

        .slogan {
            font-size: 18px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body id="body">

    <div class="header">
        ВОЛНА
        <div class="themes">
            <span onclick="setTheme('default')">ФИОЛЕТ</span>
            <span onclick="setTheme('black')">ЧЕРНЫЙ</span>
            <span onclick="setTheme('white')">БЕЛЫЙ</span>
        </div>
    </div>

    <div class="slogan">ПОДКЛЮЧИСЬ И ЛОВИ ВОЛНУ</div>

    <div class="input-section">
        <input type="text" placeholder="НАПИШИ ЧТО-НИБУДЬ И ЖМИ ENTER...">
    </div>

    <div id="feed" style="margin-top: 50px;">
        <div class="post">
            <span class="nick">АДМИН</span>: добро пожаловать на волну. тут всё как на итд.
        </div>
        <div class="post">
            <span class="nick">USER_777</span>: лови волну 🌊🌊🌊
        </div>
    </div>

    <script>
        function setTheme(theme) {
            if(theme === 'default') document.body.removeAttribute('data-theme');
            else document.body.setAttribute('data-theme', theme);
        }
    </script>
</body>
</html>
